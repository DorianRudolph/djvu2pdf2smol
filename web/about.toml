# cargo-about configuration for licenses.html (web/build.sh): the crates compiled into the
# wasm module. Where a crate offers a choice, the first license in this list is used.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "Zlib", "Unicode-3.0", "BSL-1.0", "0BSD", "Unlicense"]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# OpenJPEG's license file is a C comment, which the license detector does not recognize;
# use that file as is (the checksum pins its exact text)
[openjp2.clarify]
license = "BSD-2-Clause"

[[openjp2.clarify.files]]
path = "LICENSE"
license = "BSD-2-Clause"
checksum = "a6af136f3e15038a666b61f376612a07d9a4e48cb7c01adbf3e33b3f14ab49b6"

# Sub-crates of djvu-rs carry no license file of their own; use the repository root LICENSE
